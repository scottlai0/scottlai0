<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" role="img" aria-label="scott@github neofetch: Fullstack &amp; Data Engineer">
  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 15px; }
    .g  { fill: #39FF14; }
    .dim { fill: #2ea043; }
    .k  { fill: #39FF14; font-weight: 700; }
    .v  { fill: #c9d1d9; }
    .m  { fill: #8b949e; }
    .art { fill: #39FF14; font-size: 14px; white-space: pre; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .l { opacity: 0; animation: show 0.01s forwards; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes show { to { opacity: 1; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="818" height="338" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="818" height="34" rx="10" fill="#161b22"/>
  <rect x="1" y="25" width="818" height="10" fill="#161b22"/>
  <line x1="1" y1="35" x2="819" y2="35" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="410" y="23" text-anchor="middle" class="m" style="font-size:13px">scott@github: ~</text>

  <!-- prompt -->
  <text x="24" y="66"><tspan class="g">scott@github</tspan><tspan class="v">:</tspan><tspan fill="#58a6ff">~</tspan><tspan class="v">$ neofetch</tspan></text>

  <!-- ASCII art: "SL" -->
  <g class="l" style="animation-delay:0.3s">
    <text x="24" y="104" class="art">  ███████╗ ██╗     </text>
    <text x="24" y="122" class="art">  ██╔════╝ ██║     </text>
    <text x="24" y="140" class="art">  ███████╗ ██║     </text>
    <text x="24" y="158" class="art">  ╚════██║ ██║     </text>
    <text x="24" y="176" class="art">  ███████║ ███████╗</text>
    <text x="24" y="194" class="art">  ╚══════╝ ╚══════╝</text>
    <text x="24" y="226" class="art dim">   {  fullstack  }</text>
    <text x="24" y="244" class="art dim">   [    data     ]</text>
    <text x="24" y="262" class="art dim">   &lt;   devops    &gt;</text>
  </g>

  <!-- info -->
  <g transform="translate(300,0)">
    <text x="0" y="100" class="l" style="animation-delay:0.5s"><tspan class="k">scott</tspan><tspan class="v">@</tspan><tspan class="k">github</tspan></text>
    <text x="0" y="118" class="m l" style="animation-delay:0.5s">-------------------</text>
    <text x="0" y="142" class="l" style="animation-delay:0.7s"><tspan class="k">Name    </tspan><tspan class="v">: Scott Lai</tspan></text>
    <text x="0" y="164" class="l" style="animation-delay:0.9s"><tspan class="k">Role    </tspan><tspan class="v">: Fullstack &amp; Data Engineer</tspan></text>
    <text x="0" y="186" class="l" style="animation-delay:1.1s"><tspan class="k">Frontend</tspan><tspan class="v">: React, Angular, TypeScript</tspan></text>
    <text x="0" y="208" class="l" style="animation-delay:1.3s"><tspan class="k">Backend </tspan><tspan class="v">: Python, FastAPI</tspan></text>
    <text x="0" y="230" class="l" style="animation-delay:1.5s"><tspan class="k">Data    </tspan><tspan class="v">: SQL, NoSQL, Vertex AI</tspan></text>
    <text x="0" y="252" class="l" style="animation-delay:1.7s"><tspan class="k">Cloud   </tspan><tspan class="v">: GCP, Docker</tspan></text>
    <text x="0" y="274" class="l" style="animation-delay:1.9s"><tspan class="k">Uptime  </tspan><tspan class="v">: UTC+8 · shipping daily</tspan></text>

    <!-- color blocks -->
    <g class="l" style="animation-delay:2.1s">
      <rect x="0"   y="290" width="26" height="14" fill="#0d1117" stroke="#30363d"/>
      <rect x="26"  y="290" width="26" height="14" fill="#ff5f56"/>
      <rect x="52"  y="290" width="26" height="14" fill="#27c93f"/>
      <rect x="78"  y="290" width="26" height="14" fill="#ffbd2e"/>
      <rect x="104" y="290" width="26" height="14" fill="#58a6ff"/>
      <rect x="130" y="290" width="26" height="14" fill="#bc8cff"/>
      <rect x="156" y="290" width="26" height="14" fill="#39c5cf"/>
      <rect x="182" y="290" width="26" height="14" fill="#c9d1d9"/>
    </g>
  </g>

  <!-- trailing prompt with blinking cursor -->
  <text x="24" y="322" class="l" style="animation-delay:2.3s"><tspan class="g">scott@github</tspan><tspan class="v">:</tspan><tspan fill="#58a6ff">~</tspan><tspan class="v">$ </tspan></text>
  <g class="l" style="animation-delay:2.3s">
    <rect x="168" y="310" width="9" height="16" class="g cursor"/>
  </g>
</svg>
